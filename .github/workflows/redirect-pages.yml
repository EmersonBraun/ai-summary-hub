# Publishes the static redirect shell (redirect/) to GitHub Pages.
# The old Docusaurus site is retired; GitHub Pages now only bounces every
# old URL to the new Fumadocs site on aisummaryhub.dev (path-preserving).
# No untrusted event input is used anywhere in this workflow.
name: Deploy redirect to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'redirect/**'
      - '.github/workflows/redirect-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v4
